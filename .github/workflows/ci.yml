name: CI - Build & Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Build & Validate Fullstack App
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Client Dependencies
        run: npm --prefix client ci || npm --prefix client install

      - name: Install Server Dependencies
        run: npm --prefix server ci || npm --prefix server install

      - name: Lint Client (Next.js & TypeScript)
        run: npm run lint --prefix client

      - name: Validate Server TypeScript Build
        run: npm run build --prefix server

      - name: Build Next.js Production Client
        run: npm run build --prefix client
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
